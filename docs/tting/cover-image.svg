<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#161628"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6500"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Background decorative circles (subtle) -->
  <circle cx="520" cy="80" r="140" fill="none" stroke="#FF6500" stroke-width="1" opacity="0.08"/>
  <circle cx="520" cy="80" r="100" fill="none" stroke="#FF6500" stroke-width="1" opacity="0.08"/>
  <circle cx="520" cy="80" r="60" fill="#FF6500" opacity="0.05"/>

  <!-- Top label -->
  <rect x="40" y="40" width="110" height="26" rx="13" fill="#FF6500" opacity="0.15"/>
  <text x="95" y="58" text-anchor="middle"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"
        font-size="12" fill="#FF6500" font-weight="600">AI 에이전트</text>

  <!-- Service name -->
  <text x="40" y="148"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"
        font-size="88" font-weight="900" fill="url(#title)" letter-spacing="-3">리뷰팟</text>

  <!-- Orange underline accent -->
  <rect x="40" y="160" width="240" height="3" rx="2" fill="url(#orange)"/>

  <!-- Value prop lines -->
  <text x="40" y="204"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"
        font-size="17" fill="#FF6500" font-weight="700">쿠팡에서 뭔가 샀다면,</text>
  <text x="40" y="234"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"
        font-size="17" fill="#94A3B8">30초 후기만 남기면 나머지는 알아서 됩니다.</text>

  <!-- 3-step mini flow (text only, clean) -->
  <rect x="40" y="268" width="510" height="60" rx="12" fill="#FFFFFF" opacity="0.04"/>
  <rect x="40" y="268" width="510" height="60" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Step texts -->
  <text x="118" y="303" text-anchor="middle"
        font-family="'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="13" fill="#E2E8F0">🛍 구매</text>

  <text x="192" y="303" text-anchor="middle" font-size="12" fill="#FF6500">▶</text>

  <text x="268" y="303" text-anchor="middle"
        font-family="'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="13" fill="#E2E8F0">💬 30초 후기</text>

  <text x="344" y="303" text-anchor="middle" font-size="12" fill="#FF6500">▶</text>

  <text x="420" y="303" text-anchor="middle"
        font-family="'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="13" fill="#E2E8F0">📱 블로그 + 숏폼</text>

  <text x="496" y="303" text-anchor="middle" font-size="12" fill="#FF6500">▶</text>

  <text x="540" y="296" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11" fill="#FFB800" font-weight="700">파트너스</text>
  <text x="540" y="312" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11" fill="#FFB800" font-weight="700">수익</text>

  <!-- Bottom -->
  <text x="40" y="368"
        font-family="'Apple SD Gothic Neo', Arial, sans-serif"
        font-size="13" fill="#475569">대학생 쿠팡 파트너스 수익화 에이전트</text>

  <!-- Price badge -->
  <rect x="496" y="352" width="66" height="26" rx="13" fill="url(#orange)"/>
  <text x="529" y="370" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13" font-weight="bold" fill="white">2 달러</text>
</svg>
